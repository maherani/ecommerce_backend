#version: '3.8'

services:
  db:
    image: postgres:15-alpine
    # این بخش مستقیماً از فایل .env خوانده می‌شود
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
#    ports:   
#        - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend_network

  redis:
    image: redis:7-alpine
    ports:
        - "6379:6379"
    restart: unless-stopped
    networks:
      - backend_network

  # سرویس بک‌اند ما (در فاز بعدی فعال می‌شود)
  web:
     build: .
     command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
     volumes:
       - .:/app
     ports:
       - "8000:8000"
     env_file:
       - .env  # با این خط، تمام متغیرهای .env در دسترس پایتون قرار می‌گیرند
     depends_on:
       - db
       - redis
     networks:
      - backend_network

  celery_worker:
    build: .
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
    networks:
      - backend_network

networks:
   backend_network:
     driver: bridge

volumes:
  postgres_data:
